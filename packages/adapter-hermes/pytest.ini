[pytest]
# Hermes Python-plugin unit tests (pure-Python, no live daemon).
# The tests live in pytests/ (NOT under hermes-plugin/, which ships its own
# __init__.py as the plugin module itself — a sibling tests dir there would be
# swept up as a sub-package and import the plugin before the host-module stubs
# in conftest.py are installed). importlib import mode keeps collection isolated.
testpaths = pytests
addopts = --import-mode=importlib
