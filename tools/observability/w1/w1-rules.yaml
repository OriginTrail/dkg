        expr: "sum(rate({__name__=~\"dkg_sync_operation_duration_ms(_milliseconds)?_sum\", lane=~\"durable|changelog\", source=~\"catchup-foreground\", instance=~\"${node:regex}\"}[1h])) / sum(rate({__name__=~\"dkg_sync_operation_duration_ms(_milliseconds)?_sum\", lane=~\"durable|changelog\", source=~\"catchup-foreground|on-connect|reconcile\", instance=~\"${node:regex}\"}[1h]))"
      # recurring peer contact — durable bytes/hour (I2 + I3)
      - record: w1:reconnect:recurring_durable_bytes_per_hour
        expr: "3600 * ((sum(rate({__name__=~\"dkg_sync_attempt_request_bytes(_total)?\", plane=\"durable\", phase=~\"data|meta|delta\", source=~\"on-connect|reconcile\", instance=~\"${node:regex}\"}[1h])) or vector(0)) + (sum(rate({__name__=~\"dkg_sync_attempt_response_bytes(_total)?\", plane=\"durable\", phase=~\"data|meta|delta\", source=~\"on-connect|reconcile\", instance=~\"${node:regex}\"}[1h])) or vector(0)))"
      # recurring peer contact — durable attempts/hour (I1)
      - record: w1:reconnect:recurring_durable_attempts_per_hour
        expr: "3600 * sum(rate(dkg_sync_attempt_total{plane=\"durable\", phase=~\"data|meta|delta\", source=~\"on-connect|reconcile\", instance=~\"${node:regex}\"}[1h]))"
      # recurring peer contact — durable active ms/hour (I4 sum)
      - record: w1:reconnect:recurring_durable_active_ms_per_hour
        expr: "3600 * sum(rate({__name__=~\"dkg_sync_operation_duration_ms(_milliseconds)?_sum\", lane=~\"durable|changelog\", source=~\"on-connect|reconcile\", instance=~\"${node:regex}\"}[1h]))"
      # recurring peer contact — share of eligible durable bytes
      - record: w1:reconnect:recurring_share_of_eligible_durable_bytes
        expr: "((sum(rate({__name__=~\"dkg_sync_attempt_request_bytes(_total)?\", plane=\"durable\", phase=~\"data|meta|delta\", source=~\"on-connect|reconcile\", instance=~\"${node:regex}\"}[1h])) or vector(0)) + (sum(rate({__name__=~\"dkg_sync_attempt_response_bytes(_total)?\", plane=\"durable\", phase=~\"data|meta|delta\", source=~\"on-connect|reconcile\", instance=~\"${node:regex}\"}[1h])) or vector(0))) / ((sum(rate({__name__=~\"dkg_sync_attempt_request_bytes(_total)?\", plane=\"durable\", phase=~\"data|meta|delta\", source=~\"catchup-foreground|on-connect|reconcile\", instance=~\"${node:regex}\"}[1h])) or vector(0)) + (sum(rate({__name__=~\"dkg_sync_attempt_response_bytes(_total)?\", plane=\"durable\", phase=~\"data|meta|delta\", source=~\"catchup-foreground|on-connect|reconcile\", instance=~\"${node:regex}\"}[1h])) or vector(0)))"
      # recurring peer contact — share of eligible durable active ms
      - record: w1:reconnect:recurring_share_of_eligible_durable_active_ms
        expr: "sum(rate({__name__=~\"dkg_sync_operation_duration_ms(_milliseconds)?_sum\", lane=~\"durable|changelog\", source=~\"on-connect|reconcile\", instance=~\"${node:regex}\"}[1h])) / sum(rate({__name__=~\"dkg_sync_operation_duration_ms(_milliseconds)?_sum\", lane=~\"durable|changelog\", source=~\"catchup-foreground|on-connect|reconcile\", instance=~\"${node:regex}\"}[1h]))"
      # excluded / reported separately — durable bytes/hour (I2 + I3)
      - record: w1:reconnect:excluded_durable_bytes_per_hour
        expr: "3600 * ((sum(rate({__name__=~\"dkg_sync_attempt_request_bytes(_total)?\", plane=\"durable\", phase=~\"data|meta|delta\", source=~\"catchup-background|vm-recovery|swm-recovery|control-plane\", instance=~\"${node:regex}\"}[1h])) or vector(0)) + (sum(rate({__name__=~\"dkg_sync_attempt_response_bytes(_total)?\", plane=\"durable\", phase=~\"data|meta|delta\", source=~\"catchup-background|vm-recovery|swm-recovery|control-plane\", instance=~\"${node:regex}\"}[1h])) or vector(0)))"
      # excluded / reported separately — durable attempts/hour (I1)
      - record: w1:reconnect:excluded_durable_attempts_per_hour
        expr: "3600 * sum(rate(dkg_sync_attempt_total{plane=\"durable\", phase=~\"data|meta|delta\", source=~\"catchup-background|vm-recovery|swm-recovery|control-plane\", instance=~\"${node:regex}\"}[1h]))"
      # excluded / reported separately — durable active ms/hour (I4 sum)
      - record: w1:reconnect:excluded_durable_active_ms_per_hour
        expr: "3600 * sum(rate({__name__=~\"dkg_sync_operation_duration_ms(_milliseconds)?_sum\", lane=~\"durable|changelog\", source=~\"catchup-background|vm-recovery|swm-recovery|control-plane\", instance=~\"${node:regex}\"}[1h]))"
      # Operations rejected before starting (I5)
      - record: w1:reconnect:rejected_operations_by_reason
        expr: "sum by (reason) (increase(dkg_sync_operation_rejected_total{lane=~\"durable|changelog\", instance=~\"${node:regex}\"}[1h]))"
      # Single-flight joins by scope (I6)
      - record: w1:reconnect:singleflight_joins_by_scope
        expr: "sum by (scope) (increase(dkg_sync_singleflight_joins_total{instance=~\"${node:regex}\"}[1h]))"
      # Corroborating pressure — sync scheduler queue wait p95
      - record: w1:reconnect:sync_scheduler_queue_wait_p95_ms
        expr: "histogram_quantile(0.95, sum by (le, lane) (rate({__name__=~\"dkg_sync_scheduler_queue_wait_ms(_milliseconds)?_bucket\", scheduler=\"sync-global\", instance=~\"${node:regex}\"}[1h])))"
      # Corroborating pressure — oldest queued item age
      - record: w1:reconnect:sync_scheduler_oldest_queued_age_ms
        expr: "max by (lane) ({__name__=~\"dkg_backpressure_oldest_queued_age_ms(_milliseconds)?\", scheduler=\"sync-global\", instance=~\"${node:regex}\"})"
      # Catch-up subscribe requests by route result (I7)
      - record: w1:reconnect:catchup_requests_by_result
        expr: "sum by (result) (increase(dkg_context_graph_catchup_requests_total{instance=~\"${node:regex}\"}[1h]))"
      # Catch-up jobs by terminal status and admission path (I8)
      - record: w1:reconnect:catchup_jobs_by_status_and_admission
        expr: "sum by (status, admission) (increase(dkg_context_graph_catchup_jobs_total{instance=~\"${node:regex}\"}[1h]))"
      # Walk catch-up job duration p95 (I9)
      - record: w1:reconnect:catchup_walk_job_duration_p95_ms
        expr: "histogram_quantile(0.95, sum by (le, admission) (rate({__name__=~\"dkg_context_graph_catchup_job_duration_ms(_milliseconds)?_bucket\", instance=~\"${node:regex}\"}[1h])))"
