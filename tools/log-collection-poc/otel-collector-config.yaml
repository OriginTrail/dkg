# Receives OTLP logs from DKG nodes and forwards them to Loki's native OTLP
# endpoint. `debug` exporter prints received records to the collector log so
# you can confirm ingest without opening Grafana.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  batch: {}
  # OPTIONAL collector-side backstop redaction for the free-form log body
  # (defense-in-depth on top of the node's at-source redaction). Uncomment to
  # scrub any bare key material that slipped through without a key-name.
  # transform:
  #   log_statements:
  #     - context: log
  #       statements:
  #         - replace_pattern(body.string, "0x[0-9a-fA-F]{64}", "[REDACTED-HEX]")

exporters:
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
  debug:
    verbosity: detailed

service:
  pipelines:
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/loki, debug]
    # Traces + metrics from the node's OTel SDK. The `debug` exporter prints
    # them to the collector log (docker compose logs otel-collector) so you can
    # confirm export without a Tempo/Prometheus backend. Swap in otlphttp →
    # Tempo (traces) and a prometheus exporter/remote-write (metrics) for prod.
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
