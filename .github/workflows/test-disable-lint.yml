name: Disabled-test ratchet

# Blocks net-new disabled test declarations and test-targeting Vitest
# exclusions. Existing findings are grandfathered; ticketed exceptions stay
# visible beside the affected source through test-disable-allow pragmas.
#
# Pull requests and merge groups are synthetic merge commits. Their first
# parent is the exact base tip GitHub merged against, so HEAD^1 is deliberately
# used instead of the potentially stale pull_request.base.sha event value.

on:
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: test-disable-lint-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-disable-lint:
    name: Disabled-test ratchet
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 2

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies (no scripts)
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Scan for net-new disabled test coverage
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            node scripts/test-disable-lint.mjs --all
          else
            BASE_SHA="$(git rev-parse HEAD^1)"
            node scripts/test-disable-lint.mjs --diff "${BASE_SHA}" HEAD
          fi
