name: Documentation contracts
on:
  pull_request:
    paths:
      - 'docs/**'
      - 'examples/docs/**'
      - 'scripts/docs/**'
      - 'packages/cli/skills/dkg-node/SKILL.md'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - run: node scripts/docs/check.mjs
      - run: node --test scripts/docs/*.test.mjs
      - run: node --check examples/docs/http-app.mjs
      - run: node --check scripts/docs/smoke.mjs
