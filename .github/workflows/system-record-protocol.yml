name: System-record protocol evidence

on:
  push:
    branches:
      - testnet-canary
    paths:
      - '.github/workflows/system-record-protocol.yml'
      - 'devnet/issue-2052-system-records/**'
      - 'docs/adr/0002-system-record-sync-v1.md'
      - 'package.json'
      - 'packages/core/**'
      - 'packages/rdf-utils/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.base.json'
  pull_request:
    paths:
      - '.github/workflows/system-record-protocol.yml'
      - 'devnet/issue-2052-system-records/**'
      - 'docs/adr/0002-system-record-sync-v1.md'
      - 'package.json'
      - 'packages/core/**'
      - 'packages/rdf-utils/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.base.json'
  workflow_dispatch:

concurrency:
  group: system-record-protocol-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  protocol-evidence:
    name: Protocol evidence
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build harness dependency closure
        run: pnpm --filter @origintrail-official/dkg-core... build

      - name: Typecheck protocol evidence
        run: pnpm typecheck:issue-2052:system-records

      - name: Test protocol evidence
        run: pnpm test:issue-2052:system-records

      - name: Characterize committed evidence
        run: pnpm characterize:issue-2052:system-records
