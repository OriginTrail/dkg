name: RFC-64 inventory Windows gate

on:
  pull_request:
    paths:
      - '.github/workflows/rfc64-inventory-windows.yml'
      - 'devnet/_bootstrap/package.json'
      - 'devnet/_bootstrap/rdf-canonize.d.ts'
      - 'devnet/_bootstrap/rfc64-evidence*'
      - 'devnet/_bootstrap/tsconfig.evidence.json'
      - 'devnet/_bootstrap/vitest.evidence.config.ts'
      - 'package.json'
      - 'packages/agent/src/rfc64/inventory-v1/**'
      - 'packages/agent/src/rfc64/author-catalog-producer.ts'
      - 'packages/agent/src/rfc64/control-object-store-v1.ts'
      - 'packages/agent/src/rfc64/control-object-store-v1-internal.ts'
      - 'packages/agent/src/rfc64/durable-file-store-v1.ts'
      - 'packages/agent/src/rfc64/persistence-layout-v1.ts'
      - 'packages/agent/src/rfc64/persistence-v1.ts'
      - 'packages/agent/src/rfc64/secure-filesystem-policy-v1.ts'
      - 'packages/agent/src/dkg-agent-base.ts'
      - 'packages/agent/src/index.ts'
      - 'packages/agent/test/rfc64-inventory-v1-*.test.ts'
      - 'packages/agent/test/rfc64-agent-inventory-lifecycle.test.ts'
      - 'packages/agent/test/rfc64-author-catalog-producer.test.ts'
      - 'packages/agent/test/rfc64-control-object-store-lifecycle-v1.test.ts'
      - 'packages/agent/test/rfc64-control-object-store-v1.test.ts'
      - 'packages/agent/test/rfc64-durable-file-store-v1.test.ts'
      - 'packages/agent/test/rfc64-secure-filesystem-policy-v1.test.ts'
      - 'packages/agent/test/support/rfc64-control-object-store-fixtures.ts'
      - 'packages/agent/test/support/rfc64-control-object-store-test-support.ts'
      - 'packages/agent/test/rfc64-control-store-public-api.typecheck.ts'
      - 'packages/agent/test/rfc64-persistence-owner.typecheck.ts'
      - 'packages/agent/test/fixtures/rfc64-inventory-v1-child.ts'
      - 'packages/agent/test/fixtures/rfc64-agent-inventory-lifecycle-child.ts'
      - 'packages/agent/vitest.unit.config.ts'
      - 'packages/agent/package.json'
      - 'packages/core/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.base.json'
  workflow_dispatch:

concurrency:
  group: rfc64-inventory-windows-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  inventory-lifecycle:
    name: SQLite lifecycle (Windows)
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck RFC-64 evidence harness
        run: pnpm typecheck:devnet:rfc64-evidence

      - name: Test RFC-64 evidence harness
        run: pnpm test:devnet:rfc64-evidence

      - name: Build agent dependency closure
        run: pnpm --filter @origintrail-official/dkg-agent... run build

      - name: Typecheck the lifecycle crash harness
        run: >-
          pnpm exec tsc --noEmit --target ES2022 --module NodeNext
          --moduleResolution NodeNext --types node,vitest/globals --skipLibCheck
          packages/agent/test/rfc64-inventory-v1-lifecycle.test.ts
          packages/agent/test/fixtures/rfc64-inventory-v1-child.ts

      - name: Run RFC-64 inventory tests
        run: >-
          pnpm --filter @origintrail-official/dkg-agent exec vitest run
          --config vitest.unit.config.ts
          test/rfc64-inventory-v1
          test/rfc64-agent-inventory-lifecycle.test.ts
          test/rfc64-author-catalog-producer.test.ts
          test/rfc64-control-object-store-v1.test.ts
          test/rfc64-control-object-store-lifecycle-v1.test.ts
          test/rfc64-durable-file-store-v1.test.ts
          test/rfc64-secure-filesystem-policy-v1.test.ts
