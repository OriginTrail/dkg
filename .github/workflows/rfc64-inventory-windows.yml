name: RFC-64 inventory Windows gate

on:
  push:
    branches:
      - integration/rfc64-devnet
    paths:
      - '.github/workflows/rfc64-inventory-windows.yml'
      - 'scripts/ci/run-windows-persistence-evidence.mjs'
      - 'scripts/ci/run-process-tree.mjs'
      - 'scripts/lib/__tests__/process-tree-timeout.test.mjs'
      - 'scripts/lib/__tests__/windows-persistence-ci.test.mjs'
      - 'devnet/_bootstrap/package.json'
      - 'devnet/_bootstrap/rdf-canonize.d.ts'
      - 'devnet/_bootstrap/rfc64-evidence*'
      - 'devnet/_bootstrap/tsconfig.evidence.json'
      - 'devnet/_bootstrap/vitest.evidence.config.ts'
      - 'devnet/rfc64-persistence-lifecycle/**'
      - 'package.json'
      - 'packages/agent/**'
      - 'packages/chain/**'
      - 'packages/core/**'
      - 'packages/publisher/**'
      - 'packages/query/**'
      - 'packages/random-sampling/**'
      - 'packages/rdf-utils/**'
      - 'packages/storage/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.base.json'
  pull_request:
    paths:
      - '.github/workflows/rfc64-inventory-windows.yml'
      - 'scripts/ci/run-windows-persistence-evidence.mjs'
      - 'scripts/ci/run-process-tree.mjs'
      - 'scripts/lib/__tests__/process-tree-timeout.test.mjs'
      - 'scripts/lib/__tests__/windows-persistence-ci.test.mjs'
      - 'devnet/_bootstrap/package.json'
      - 'devnet/_bootstrap/rdf-canonize.d.ts'
      - 'devnet/_bootstrap/rfc64-evidence*'
      - 'devnet/_bootstrap/tsconfig.evidence.json'
      - 'devnet/_bootstrap/vitest.evidence.config.ts'
      - 'devnet/rfc64-persistence-lifecycle/**'
      - 'package.json'
      - 'packages/agent/**'
      - 'packages/chain/**'
      - 'packages/core/**'
      - 'packages/publisher/**'
      - 'packages/query/**'
      - 'packages/random-sampling/**'
      - 'packages/rdf-utils/**'
      - 'packages/storage/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.base.json'
  workflow_dispatch:

concurrency:
  group: rfc64-inventory-windows-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  inventory-lifecycle:
    name: SQLite lifecycle (Windows, ${{ matrix.group }})
    runs-on: windows-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          # The control-object files account for most of the filesystem time.
          # Each group has its own runner, temporary stores, and process tree.
          - group: inventory
            tests: >-
              test/finalization-recovery-sqlite-deferred.test.ts
              test/finalization-recovery-sqlite-migration.test.ts
              test/finalization-recovery-sqlite-store.test.ts
              test/rfc64-inventory-v1
              test/rfc64-agent-inventory-lifecycle.test.ts
              test/rfc64-author-catalog-producer.test.ts
          - group: object-stores
            tests: >-
              test/rfc64-control-object-store-v1.test.ts
              test/rfc64-control-object-store-lifecycle-v1.test.ts
              test/rfc64-durable-file-store-v1.test.ts
              test/rfc64-secure-filesystem-policy-v1.test.ts
    steps:
      - name: Checkout candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build agent dependency closure
        # The canonical Gate 0 closure excludes unnecessary Solidity compilation.
        run: pnpm test:gate0:rfc64-persistence-lifecycle:build

      - name: Validate persistence evidence
        if: matrix.group == 'inventory'
        run: pnpm ci:rfc64-persistence-evidence

      - name: Run SQLite persistence tests
        run: >-
          pnpm --filter @origintrail-official/dkg-agent exec vitest run
          --config vitest.unit.config.ts
          ${{ matrix.tests }}
