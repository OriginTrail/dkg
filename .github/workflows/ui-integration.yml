name: UI loading integration

on:
  pull_request:
    paths:
      - '.github/workflows/ui-integration.yml'
      - 'packages/node-ui/**'
      - 'packages/cli/**'
      - 'packages/graph-viz/**'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 25.2.1
          cache: pnpm
      - name: Install workspace and SQLite dependencies
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm --dir node_modules/.pnpm/better-sqlite3@12.11.1/node_modules/better-sqlite3 run install
      - name: Install pinned Rust and Wasm targets
        run: |
          rustup toolchain install nightly-2026-08-18 --profile minimal \
            --target wasm32-unknown-unknown --target wasm32-wasip2
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/wasm-bindgen
            ~/.cargo/bin/wasm-bindgen-test-runner
            ~/.cargo/bin/wasm2es6js
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ui-integration-${{ runner.os }}-${{ runner.arch }}-nightly-2026-08-18-wbg-0.2.127-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            ui-integration-${{ runner.os }}-${{ runner.arch }}-nightly-2026-08-18-wbg-0.2.127-
      - name: Install pinned Wasm binding generator
        run: |
          if ! command -v wasm-bindgen >/dev/null 2>&1 \
            || [[ "$(wasm-bindgen --version)" != "wasm-bindgen 0.2.127" ]]; then
            cargo +nightly-2026-08-18 install wasm-bindgen-cli --version 0.2.127 --locked
          fi
      - name: Build and verify native runtime and TypeScript dependencies
        run: |
          node scripts/build-semantic-runtime.mjs
          pnpm -r --filter '@origintrail-official/dkg...' --filter '!@origintrail-official/dkg-evm-module' exec tsc
      - name: Verify pagination, caching, resource selection and private HTTP requests
        env:
          NODE_OPTIONS: --no-experimental-webstorage
        run: |
          pnpm --filter @origintrail-official/dkg-node-ui exec vitest run
          pnpm --filter @origintrail-official/dkg test:unit test/notifications-route-bounded.test.ts --maxWorkers=1
      - name: Build production UI
        run: |
          pnpm --filter @origintrail-official/dkg-graph-viz build
          pnpm --filter @origintrail-official/dkg-node-ui build:ui
