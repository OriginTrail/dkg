name: LLM chat integration

on:
  pull_request:
    paths:
      - '.github/workflows/llm-chat-integration.yml'
      - 'packages/cli/**'
      - 'packages/local-llm/**'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: llm-chat-integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 25.2.1
          cache: pnpm
      - name: Install locked dependencies
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm --dir node_modules/.pnpm/better-sqlite3@12.11.1/node_modules/better-sqlite3 run install
      - name: Build TypeScript dependencies
        run: pnpm -r --filter '@origintrail-official/dkg...' --filter '!@origintrail-official/dkg-evm-module' exec tsc
      - name: Verify context recovery, required tools and scoped catalog reads
        run: |
          pnpm --filter @origintrail-official/dkg-local-llm exec vitest run
          pnpm --filter @origintrail-official/dkg test:unit test/daemon-local-llm-route.test.ts test/daemon-local-llm-service.test.ts test/local-llm-runtime-factory.test.ts test/query-catalog-profile-route.test.ts --maxWorkers=1
