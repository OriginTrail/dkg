name: Oxigraph lifecycle on macOS

# The CLI test lanes run on Linux, where Oxigraph's listener, lock holders and
# process identities come from /proc. macOS nodes find them through ps and
# lsof instead, so the real-process lifecycle tests also run there whenever
# that code changes.
on:
  pull_request:
    paths:
      - 'packages/cli/src/daemon/oxigraph-*.ts'
      - 'packages/cli/src/daemon/process-probe.ts'
      - 'packages/cli/src/daemon/oxigraph-store-launch.ts'
      - 'packages/cli/src/own-module-path.ts'
      - 'packages/cli/test/oxigraph-orphan-*.test.ts'
      - 'packages/cli/test/oxigraph-listen-port.test.ts'
      - 'packages/cli/test/oxigraph-parent-watchdog.test.ts'
      - 'packages/cli/test/oxigraph-server.test.ts'
      - 'packages/cli/test/oxigraph-launch-strategy.test.ts'
      - 'packages/cli/test/fixtures/oxigraph-*.ts'
      - 'packages/cli/src/daemon/fs-utils.ts'
      - 'packages/cli/src/daemon/atomic-write.ts'
      # Inputs that decide installation, build output and test discovery.
      - 'pnpm-lock.yaml'
      - 'packages/cli/package.json'
      - 'packages/cli/vitest.unit.config.ts'
      - 'scripts/build-runtime-packages.mjs'
      - 'scripts/lib/runtime-build-plan.mjs'
      - 'scripts/lib/run-build-command.mjs'
      - '.github/workflows/oxigraph-lifecycle-native.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oxigraph-lifecycle-native-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lifecycle:
    name: Oxigraph lifecycle (macOS)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build runtime packages
        run: node scripts/build-runtime-packages.mjs
      - name: Run the real-process Oxigraph lifecycle tests
        run: >-
          pnpm --dir packages/cli exec vitest run --config vitest.unit.config.ts
          test/oxigraph-orphan-lifecycle.test.ts
          test/oxigraph-orphan-policy.test.ts
          test/oxigraph-orphan-native.test.ts
          test/oxigraph-listen-port.test.ts
          test/oxigraph-parent-watchdog.test.ts
          test/oxigraph-server.test.ts
          test/oxigraph-launch-strategy.test.ts
