name: Observability artifacts

# The Grafana dashboards + alert provisioning payloads under
# tools/log-collection-poc/production/ are GENERATED by
# generate-observability.mjs (the committed source of truth). This check
# proves the committed artifacts are exactly what the generator emits — a
# hand-edited JSON or a generator change without regeneration fails the PR
# instead of shipping stale production observability config.
on:
  pull_request:
    paths:
      - 'tools/log-collection-poc/production/**'
      # the gate must also verify itself when the gate changes
      - '.github/workflows/observability-artifacts.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-generated:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify committed artifacts match the generator
        run: node tools/log-collection-poc/production/generate-observability.mjs --check
      - name: Smoke-test the operator render mode (concrete UIDs + node-label profile)
        run: |
          set -euo pipefail
          node tools/log-collection-poc/production/generate-observability.mjs /tmp/render \
            --vm-uid test-vm-uid --loki-uid test-loki-uid --prom-node-label service_instance_id
          cd /tmp/render
          # placeholder must be fully substituted
          ! grep -q 'VM_DATASOURCE_UID' alert-rules.provisioning.json
          # concrete datasource UIDs must land in the rule payloads
          grep -q '"datasourceUid": "test-vm-uid"' alert-rules.provisioning.json
          grep -q '"datasourceUid": "test-loki-uid"' alert-rules.provisioning.json
          # node-label profile must drive metrics selectors, group-bys and alert exprs
          ! grep -q '{instance=~' grafana-dashboard-dkg-node-metrics.json
          grep -q 'service_instance_id=~' grafana-dashboard-dkg-node-metrics.json
          grep -q 'sum by (service_instance_id) (rate(dkg_publish_total' alert-rules.provisioning.json
          echo "operator render mode OK"
