name: Observability artifacts

# The Grafana dashboards + alert provisioning payloads under
# tools/observability/ are GENERATED by
# generate-observability.mjs (the committed source of truth). This check
# proves the committed artifacts are exactly what the generator emits — a
# hand-edited JSON or a generator change without regeneration fails the PR
# instead of shipping stale production observability config. A second step
# smoke-tests the operator-facing render mode (concrete datasource UIDs +
# node-label profile), so a regression there can't hide behind the
# committed-defaults check.
on:
  pull_request:
    paths:
      - 'tools/observability/**'
      # the gate must also verify itself when the gate changes
      - '.github/workflows/observability-artifacts.yml'
  workflow_dispatch:

concurrency:
  group: observability-artifacts-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Minimum-needed token scope (see ci.yml header for rationale).
permissions:
  contents: read

jobs:
  check-generated:
    name: Generated artifacts match generator
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc

      - name: Verify committed artifacts match the generator
        run: node tools/observability/generate-observability.mjs --check

      # verify-profile-render.mjs PARSES the rendered JSON and asserts the
      # whole profile-sensitive surface (every metrics target, the $node
      # variable, per-node alert exprs + summaries, notification group-bys,
      # datasourceUid/model.datasource.uid consistency, placeholder hygiene) —
      # a sampling grep cannot prove the operator render mode, a full walk can.
      - name: Verify the committed artifacts against the default node-label profile
        run: node tools/observability/verify-profile-render.mjs tools/observability --prom-node-label instance

      - name: Verify the operator render mode (concrete UIDs + alternate node-label profile)
        run: |
          set -euo pipefail
          node tools/observability/generate-observability.mjs /tmp/render \
            --vm-uid test-vm-uid --loki-uid test-loki-uid --prom-node-label service_instance_id
          node tools/observability/verify-profile-render.mjs /tmp/render \
            --prom-node-label service_instance_id --vm-uid test-vm-uid --loki-uid test-loki-uid
