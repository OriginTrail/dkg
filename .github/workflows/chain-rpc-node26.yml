name: Chain RPC transport on Node 26

# Node 26's fetch (undici 8) negotiates HTTP/2 on its own, and Node 22 and 24
# do not (#2828). The required lanes run Node 22, so the transport cases that
# need undici 8 run here whenever the chain RPC dispatcher changes.
on:
  pull_request:
    paths:
      - 'packages/chain/src/rpc-http1-dispatcher.ts'
      - 'packages/chain/test/rpc-http1-dispatcher.unit.test.ts'
      - 'packages/chain/test/helpers/local-tls.ts'
      - 'packages/chain/test/helpers/chain-rpc-fetch-child.mjs'
      # Inputs that decide installation and test discovery.
      - 'pnpm-lock.yaml'
      - 'packages/chain/package.json'
      - 'packages/chain/vitest.unit.config.ts'
      - '.github/workflows/chain-rpc-node26.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chain-rpc-node26-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  transport:
    name: Chain RPC transport (Node 26)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 26
          cache: pnpm
      - name: Install test dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify chain RPC calls stay on HTTP/1.1 through the configured dispatcher
        env:
          DKG_REQUIRE_UNDICI8_FETCH: '1'
        run: pnpm --dir packages/chain exec vitest run --config vitest.unit.config.ts test/rpc-http1-dispatcher.unit.test.ts
