name: Chain RPC transport on Node 26

# The primary CI workflow owns PR/full/merge-group selection. Manual diagnosis
# and release-candidate dispatch use this same implementation, without a second
# independently triggered PR execution.
on:
  workflow_call:
    outputs:
      evidence:
        description: Actual runtime and executed Node 26 transport assertions
        value: ${{ jobs.transport.outputs.evidence }}
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transport:
    name: Chain RPC transport (Node 26)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      evidence: ${{ steps.transport.outputs.evidence }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 26
          cache: pnpm
      - name: Install test dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify required Node 26 transport assertions executed
        id: transport
        env:
          DKG_REQUIRE_UNDICI8_FETCH: '1'
        run: node scripts/ci/run-chain-rpc-node26.mjs "${RUNNER_TEMP}/chain-rpc-node26"
      - name: Preserve runtime and assertion evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chain-rpc-node26
          path: ${{ runner.temp }}/chain-rpc-node26
          if-no-files-found: error
