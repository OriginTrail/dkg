name: SPARQL scalability lint

# Blocks PRs that ADD store-melting SPARQL shapes (O(store) scans): the #1597
# listGraphs-storm shape, #1609-style unbounded bucket-graph scans, unscoped
# all-variable scans, and OFFSET pagination. Pre-existing findings are
# grandfathered (ratchet): only NEW findings fail, and a provably bounded
# query can be acknowledged in code with
#     // sparql-scan-allow: <rule> -- <justification>
# Rules, exemptions, and fixtures live in scripts/sparql-scale-lint.mjs; the
# script self-tests before every scan so the gate cannot rot silently.
#
# Trigger notes:
#   * pull_request has NO branch filter on purpose — stacked PRs whose base is
#     a feature branch (outside ci.yml's list) still get this gate.
#   * merge_group is REQUIRED once this check is marked required: without it
#     the merge queue would wait forever for a check that never runs.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  merge_group:
  # Manual run = full-tree audit (never fails; prints the current debt).
  workflow_dispatch:

concurrency:
  group: sparql-lint-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Minimum-needed token scope (see ci.yml header for rationale).
permissions:
  contents: read

jobs:
  sparql-scale-lint:
    name: SPARQL scalability lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          # The PR/merge-group checkout is a synthetic merge commit; depth 2
          # includes both parents, so HEAD^1 is the exact base tip GitHub
          # merged against. The event payload's pull_request.base.sha is a
          # STALE snapshot (see ci.yml plan job for the incident writeup) —
          # never use it for the diff.
          fetch-depth: 2

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # The scanner parses source with the TypeScript compiler API (a root
      # devDependency). --ignore-scripts skips every build/postinstall — the
      # job only needs `typescript` to resolve, so this stays seconds-fast.
      - name: Install dependencies (no scripts)
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Scan changed files for unscalable SPARQL
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            node scripts/sparql-scale-lint.mjs --all
          else
            BASE_SHA="$(git rev-parse HEAD^1)"
            node scripts/sparql-scale-lint.mjs --diff "${BASE_SHA}" HEAD
          fi
