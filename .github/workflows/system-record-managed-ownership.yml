name: System-record managed ownership evidence

# Live conformance gate for issue #2052 Stack B2. This launches the
# checksum-pinned Oxigraph v0.5.8 server and drives the real production store
# stack against it. Unit tests and the embedded adapter explicitly cannot
# satisfy this gate: the properties proven here are about a separate OS process,
# its listen socket, and what a supported predecessor binary can observe.

on:
  push:
    branches:
      - testnet-canary
    paths:
      - '.github/workflows/system-record-managed-ownership.yml'
      - 'devnet/issue-2052-managed-ownership/**'
      - 'docs/adr/0002-system-record-sync-v1.md'
      - 'package.json'
      - 'packages/agent/**'
      - 'packages/cli/**'
      - 'packages/core/**'
      - 'packages/rdf-utils/**'
      - 'packages/storage/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.base.json'
  pull_request:
    paths:
      - '.github/workflows/system-record-managed-ownership.yml'
      - 'devnet/issue-2052-managed-ownership/**'
      - 'docs/adr/0002-system-record-sync-v1.md'
      - 'package.json'
      - 'packages/agent/**'
      - 'packages/cli/**'
      - 'packages/core/**'
      - 'packages/rdf-utils/**'
      - 'packages/storage/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.base.json'
  workflow_dispatch:

concurrency:
  group: system-record-managed-ownership-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  managed-ownership:
    name: Managed Oxigraph ownership (live)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          # verify.ts pins HEAD on both sides of the run, so the checkout must
          # carry real commit metadata rather than a synthetic merge ref.
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck the ownership gate harness
        run: pnpm typecheck:live:system-record-managed-ownership

      - name: Storage unit conformance
        run: |
          pnpm --filter @origintrail-official/dkg-storage exec vitest run \
            test/internal-graph-policy.test.ts \
            test/managed-oxigraph-ownership-v1.test.ts \
            test/reserved-internal-graph-mutation-guard.test.ts \
            test/system-record-materializer-lifecycle-v1.test.ts \
            test/system-record-capability-discovery-v1.test.ts

      - name: Run live managed-ownership gate
        # Downloads and checksum-verifies the pinned v0.5.8 binary, then runs
        # the predecessor matrix against a real server.
        run: pnpm test:live:system-record-managed-ownership

      - name: Publish evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: managed-ownership-verdict
          path: |
            devnet/issue-2052-managed-ownership/artifacts/managed-ownership-result.json
            devnet/issue-2052-managed-ownership/artifacts/managed-ownership-verdict.json
          if-no-files-found: warn
          retention-days: 14
