name: System-record managed ownership evidence

# Live conformance gate for issue #2052 Stack B2, against the checksum-pinned
# Oxigraph v0.5.8 binary. Unit tests and the embedded adapter explicitly cannot
# satisfy it: the properties are about separate OS processes and their listen
# sockets.
#
# What it proves, precisely — the artifact is the authority, not this comment:
#
#   1. ONE real generation handoff, driven by the production supervisor
#      (`startOxigraphServer`) with a genuinely in-flight ordinary write:
#      the child is stopped only after that write drains, the write survives,
#      a second OS process is spawned, the first is dead and the second alive,
#      the replacement serves the same data, and the store resumes on it.
#   2. The capability fail-closed matrix over the real store composition.
#   3. Owned-pool socket ownership: destroy leaves nothing behind.
#   4. Reserved internal state is invisible to enumeration and undeletable by
#      generic mutation, as a supported predecessor binary would see it.
#
# What it does NOT prove: predecessor entries run against the CURRENT binary,
# not against each pinned commit — no predecessor is checked out or built. The
# B3 active-replacement CAS exists, but this ownership artifact still does
# not dispatch a verified apply. Atomic apply, lost-response recovery, and
# maximum-size p99/RSS remain separate activation gates; this workflow must not
# be cited as evidence for them.

on:
  push:
    branches:
      - testnet-canary
    paths:
      - '.github/workflows/system-record-managed-ownership.yml'
      - 'devnet/issue-2052-managed-ownership/**'
      - 'docs/adr/0002-system-record-sync-v1.md'
      - 'package.json'
      - 'packages/agent/**'
      - 'packages/cli/**'
      - 'packages/core/**'
      - 'packages/rdf-utils/**'
      - 'packages/storage/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.base.json'
  pull_request:
    paths:
      - '.github/workflows/system-record-managed-ownership.yml'
      - 'devnet/issue-2052-managed-ownership/**'
      - 'docs/adr/0002-system-record-sync-v1.md'
      - 'package.json'
      - 'packages/agent/**'
      - 'packages/cli/**'
      - 'packages/core/**'
      - 'packages/rdf-utils/**'
      - 'packages/storage/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.base.json'
  workflow_dispatch:

concurrency:
  group: system-record-managed-ownership-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  managed-ownership:
    name: Managed Oxigraph ownership (live)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          # verify.ts pins HEAD on both sides of the run, so the checkout must
          # carry real commit metadata rather than a synthetic merge ref.
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build harness dependency closure
        # The harness resolves `@origintrail-official/dkg-storage` through its
        # published `dist/` types, so the closure must exist before ANY
        # typecheck. Omitting this passes locally (where a dist is usually left
        # over from a previous build) and fails only in CI.
        #
        # The CLI closure is included, not just storage's: the harness imports
        # `daemon/oxigraph-binary` and `daemon/oxigraph-server` by relative
        # SOURCE path, because the CLI package exports neither subpath. tsc then
        # follows the CLI's own imports, so every workspace package the CLI
        # depends on must have real `dist/` types. Without them tsc reports a
        # wall of TS2307 plus the implicit-any and unknown-catch errors that
        # cascade from the degraded types — which is exactly what it did, while
        # the same typecheck passed locally on leftover builds.
        #
        # Matches what `test:live:system-record-managed-ownership:generate`
        # already builds, deliberately: a typecheck over a narrower closure than
        # the run uses can only produce false results in one direction or the
        # other.
        run: >-
          pnpm -r --filter @origintrail-official/dkg...
          --filter '!@origintrail-official/dkg-evm-module' run build

      - name: Typecheck the ownership gate harness
        run: pnpm typecheck:live:system-record-managed-ownership

      - name: Storage unit conformance
        run: |
          pnpm --filter @origintrail-official/dkg-storage exec vitest run \
            test/internal-graph-policy.test.ts \
            test/managed-oxigraph-ownership-v1.test.ts \
            test/reserved-internal-graph-mutation-guard.test.ts \
            test/system-record-apply-command-v1.test.ts \
            test/system-record-atomic-apply-executor-v1.test.ts \
            test/system-record-materializer-lifecycle-v1.test.ts \
            test/system-record-control-barrier-integration-v1.test.ts \
            test/system-record-capability-discovery-v1.test.ts \
            test/system-record-inspection-v1.test.ts \
            test/system-record-managed-mutation-admission-v1.test.ts \
            test/system-record-materialization-epoch-adapter-v1.test.ts \
            test/system-record-materialization-epoch-v1.test.ts \
            test/system-record-next-state-v1.test.ts \
            test/system-record-rdf-schema-v1.test.ts \
            test/system-record-state-snapshot-v1.test.ts \
            test/system-record-utf8-order-v1.test.ts \
            test/system-record-verified-replacement-v1.test.ts \
            test/store-scheduler-system-record-admission.test.ts

      - name: Run live managed-ownership gate
        # Downloads and checksum-verifies the pinned v0.5.8 binary, then runs
        # the predecessor matrix against a real server.
        run: pnpm test:live:system-record-managed-ownership

      - name: Publish evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: managed-ownership-verdict
          path: |
            devnet/issue-2052-managed-ownership/artifacts/managed-ownership-result.json
            devnet/issue-2052-managed-ownership/artifacts/managed-ownership-verdict.json
          if-no-files-found: warn
          retention-days: 14
