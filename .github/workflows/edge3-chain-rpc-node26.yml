name: Edge 3 chain RPC transport on Node 26

on:
  pull_request:
    branches: [codex/dmaast-program-editor-deploy-20260921]
    paths:
      - 'packages/chain/**'
      - 'scripts/ci/run-edge3-chain-rpc-node26.mjs'
      - '.github/workflows/edge3-chain-rpc-node26.yml'
  push:
    branches: [codex/dmaast-program-editor-deploy-20260921]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transport:
    name: Edge 3 chain RPC transport (Node 26)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - name: Install test dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build source dependencies for transport wiring test
        run: |
          pnpm --filter @origintrail-official/dkg-http-utils build
          pnpm --filter @origintrail-official/dkg-rdf-utils build
          pnpm --filter @origintrail-official/dkg-core build
      - name: Verify Node 26 transport assertions executed
        env:
          DKG_REQUIRE_UNDICI8_FETCH: '1'
        run: node scripts/ci/run-edge3-chain-rpc-node26.mjs "${RUNNER_TEMP}/edge3-chain-rpc-node26"
      - name: Preserve runtime and assertion evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: edge3-chain-rpc-node26
          path: ${{ runner.temp }}/edge3-chain-rpc-node26
          if-no-files-found: error
