name: Edge 3 chain RPC transport on Node 26

on:
  pull_request:
    branches: [codex/dmaast-program-editor-deploy-20260921]
    paths:
      - 'packages/chain/**'
      - 'scripts/ci/run-edge3-chain-rpc-node26.mjs'
      - '.github/workflows/edge3-chain-rpc-node26.yml'
  push:
    branches: [codex/dmaast-program-editor-deploy-20260921]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transport:
    name: Edge 3 chain RPC transport (Node 26)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 26
          cache: pnpm
      - name: Install test dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify Node 26 transport assertions executed
        env:
          DKG_REQUIRE_UNDICI8_FETCH: '1'
        run: node scripts/ci/run-edge3-chain-rpc-node26.mjs "${RUNNER_TEMP}/edge3-chain-rpc-node26"
      - name: Preserve runtime and assertion evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: edge3-chain-rpc-node26
          path: ${{ runner.temp }}/edge3-chain-rpc-node26
          if-no-files-found: error
