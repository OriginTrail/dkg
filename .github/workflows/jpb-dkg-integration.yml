name: JPB DKG integration

on:
  pull_request:
    paths:
      - '.github/workflows/jpb-dkg-integration.yml'
      - 'packages/agent/**'
      - 'packages/cli/**'
      - 'packages/core/**'
      - 'packages/graph-computer/**'
      - 'packages/local-llm/**'
      - 'packages/mcp-dkg/**'
      - 'packages/node-ui/**'
      - 'packages/query/**'
      - 'packages/semantic-runtime/**'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jpb-dkg-integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 25.2.1
          cache: pnpm
      - name: Install workspace and SQLite dependencies
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm --dir node_modules/.pnpm/better-sqlite3@12.11.1/node_modules/better-sqlite3 run install
      - name: Install pinned Rust and Wasm targets
        run: |
          rustup toolchain install nightly-2026-08-18 --profile minimal \
            --target wasm32-unknown-unknown --target wasm32-wasip2
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/wasm-bindgen
            ~/.cargo/bin/wasm-bindgen-test-runner
            ~/.cargo/bin/wasm2es6js
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: jpb-dkg-${{ runner.os }}-${{ runner.arch }}-nightly-2026-08-18-wbg-0.2.127-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            jpb-dkg-${{ runner.os }}-${{ runner.arch }}-nightly-2026-08-18-wbg-0.2.127-
      - name: Install pinned Wasm binding generator
        run: |
          if ! command -v wasm-bindgen >/dev/null 2>&1 \
            || [[ "$(wasm-bindgen --version)" != "wasm-bindgen 0.2.127" ]]; then
            cargo +nightly-2026-08-18 install wasm-bindgen-cli --version 0.2.127 --locked
          fi
      - name: Build and verify native runtime and TypeScript dependencies
        run: |
          node scripts/build-semantic-runtime.mjs
          pnpm -r --filter '@origintrail-official/dkg...' --filter '!@origintrail-official/dkg-evm-module' exec tsc
      - name: Check private writes, authority, approvals, receipts and native LLM wiring
        run: |
          pnpm --filter @origintrail-official/dkg test:unit \
            test/semantic-runtime.test.ts test/semantic-runtime-configuration-api.test.ts \
            test/semantic-runtime-program-bindings.test.ts test/semantic-runtime-local-llm-adapter.test.ts \
            test/semantic-runtime-execution-output.test.ts test/semantic-runtime-graph-configuration-limits.test.ts \
            test/local-private-first-write.test.ts test/write-preflight-resilience.test.ts \
            test/context-graph-authority-route.test.ts test/notifications-route-bounded.test.ts \
            test/daemon-local-llm-route.test.ts \
            test/daemon-local-llm-service.test.ts test/local-llm-runtime-factory.test.ts \
            test/query-catalog-profile-route.test.ts --maxWorkers=1
      - name: Check LLM recovery, adapter pins and authorized Working Memory joins
        run: |
          pnpm --filter @origintrail-official/dkg-local-llm exec vitest run
          pnpm --filter @origintrail-official/dkg-mcp exec vitest run test/adapters.test.ts
          pnpm --filter @origintrail-official/dkg-query exec vitest run
      - name: Check source bundles, SDK and real Wasm Programs
        run: |
          pnpm --filter @origintrail-official/dkg-core exec vitest run test/typescript-program-bundle.test.ts
          pnpm --filter @origintrail-official/dkg-graph-computer exec vitest run
          pnpm --filter @origintrail-official/dkg-semantic-runtime exec vitest run \
            test/persistence.test.ts test/program-trace.test.ts \
            test/typescript-programs.test.ts test/typescript-bundles.test.ts --maxWorkers=1
      - name: Check Sources, HTTP chat, query catalog and Program editor
        env:
          NODE_OPTIONS: --no-experimental-webstorage
        run: |
          pnpm --filter @origintrail-official/dkg-node-ui exec vitest run \
            test/jpb-monitor-api.test.ts test/jpb-sources-page.test.ts \
            test/notifications-refresh.dom.test.ts test/use-shell-routing.test.ts \
            test/context-graph-query-catalog.test.ts test/subgraph-query-catalog.test.ts \
            test/panel-right.component.test.ts test/program-editor.test.ts --maxWorkers=1
      - name: Build production DKG UI
        run: |
          pnpm --filter @origintrail-official/dkg-graph-viz exec tsc
          pnpm --filter @origintrail-official/dkg-node-ui build:ui
