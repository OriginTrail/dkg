name: Sync test/publish with main

on:
  push:
    branches:
      - main
  schedule:
    # Pushes to main are the primary trigger. This daily run is only a recovery
    # net for a transient failed or missed push-triggered sync.
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: sync-test-publish-with-main
  cancel-in-progress: false

jobs:
  sync:
    name: Merge main into test/publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out test/publish
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: test/publish
          fetch-depth: 0
          persist-credentials: false

      - name: Merge and push latest main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main:refs/remotes/origin/main

          if git merge-base --is-ancestor origin/main HEAD; then
            echo 'test/publish already contains the latest main commit.'
            exit 0
          fi

          git merge --no-edit origin/main
          gh auth setup-git
          git push origin HEAD:test/publish
