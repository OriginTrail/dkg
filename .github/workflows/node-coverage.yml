name: Node coverage ratchet

on:
  pull_request:
    branches: [main, testnet-canary]
    paths:
      - 'packages/query/**'
      - 'packages/okf/**'
      - 'packages/node-ui/**'
      - 'packages/network-sim/**'
      - 'vitest.coverage.ts'
      - 'turbo.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.nvmrc'
      - '.github/workflows/node-coverage.yml'
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: node-coverage-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  node-coverage:
    # Keep this lane limited to packages whose coverage suites are hermetic and
    # whose checked-in ratchets are currently green. Other packages continue to
    # run their normal tests in CI; add them here once their coverage command is
    # self-contained and its existing threshold has been restored.
    name: Hermetic package coverage thresholds
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Restore Turbo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .turbo
            packages/*/.turbo
          key: node-coverage-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            node-coverage-${{ runner.os }}-
            turbo-${{ runner.os }}-
      - name: Run hermetic coverage ratchets
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: >-
          pnpm exec turbo test:coverage
          --filter='@origintrail-official/dkg-query'
          --filter='@origintrail-official/dkg-okf'
          --filter='@origintrail-official/dkg-node-ui'
          --filter='@origintrail-official/dkg-network-sim'
          --concurrency=1
          --continue=always
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: node-coverage-${{ github.run_id }}
          path: |
            packages/query/coverage/
            packages/okf/coverage/
            packages/node-ui/coverage/
            packages/network-sim/coverage/
          retention-days: 14
          if-no-files-found: warn
