name: Installed package certification

# Certify every commit pushed to main, with optional manual candidate rehearsals.
# No publishing credentials or protected-branch authority are granted.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      candidate:
        description: Full candidate commit SHA containing the certification tooling
        required: true
        type: string

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CANDIDATE: ${{ github.event_name == 'push' && github.sha || inputs.candidate }}
    steps:
      - name: Validate certification source identity
        run: '[[ "$CANDIDATE" =~ ^[a-f0-9]{40}$ ]]'
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ env.CANDIDATE }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
      - name: Prepare complete immutable package set
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "CANDIDATE_VERSION=$VERSION" >> "$GITHUB_ENV"
          node scripts/release-packages.mjs prepare-packages --version "$VERSION" --out "$RUNNER_TEMP/package-set"
      - name: Certify both actual npm layouts
        run: |
          pnpm release:certify-install --bundle "$RUNNER_TEMP/package-set" --out "$RUNNER_TEMP/package-attempt" \
            --commit "$CANDIDATE" --version "$CANDIDATE_VERSION" --profile installed-local-rdf-v1
          pnpm release:verify-package-certificate --bundle "$RUNNER_TEMP/package-set" --certificate "$RUNNER_TEMP/package-attempt/receipt.json" \
            --commit "$CANDIDATE" --version "$CANDIDATE_VERSION" --profile installed-local-rdf-v1
      - name: Prove missing installed asset fails
        run: |
          if pnpm release:certify-install --bundle "$RUNNER_TEMP/package-set" --out "$RUNNER_TEMP/package-negative" \
            --commit "$CANDIDATE" --version "$CANDIDATE_VERSION" --profile installed-local-rdf-v1 --negative-control missing-ui; then
            echo 'Negative control unexpectedly passed'; exit 1
          fi
          node --input-type=module -e '
            import fs from "node:fs";
            import assert from "node:assert/strict";
            const root = process.env.RUNNER_TEMP + "/package-negative/";
            assert.equal(JSON.parse(fs.readFileSync(root + "receipt.json")).outcome, "FAIL");
            for (const layout of ["core-slot", "edge-global"]) {
              const report = JSON.parse(fs.readFileSync(root + layout + "-report.json"));
              assert.equal(report.cases.find(c => c.id === "install").outcome, "PASS");
              assert.equal(report.cases.find(c => c.id === "runtime-assets").outcome, "FAIL");
            }'
      - name: Retain package bytes and attempt evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: installed-packages-${{ env.CANDIDATE }}-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: error
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/package-set/
            ${{ runner.temp }}/package-attempt/*.json
            ${{ runner.temp }}/package-attempt/*.jsonl
            ${{ runner.temp }}/package-attempt/*.log
            ${{ runner.temp }}/package-negative/*.json
            ${{ runner.temp }}/package-negative/*.jsonl
            ${{ runner.temp }}/package-negative/*.log
