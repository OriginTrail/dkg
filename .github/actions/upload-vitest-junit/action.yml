name: Upload Vitest JUnit report
description: Upload uniquely named JUnit and coverage evidence with the repository retention policy.

inputs:
  artifact-name:
    description: Unique artifact name for this package or shard.
    required: true

runs:
  using: composite
  steps:
    - name: Upload JUnit XML
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ inputs.artifact-name }}
        path: |
          packages/*/test-results/*.xml
          packages/*/test-results/*.coverage.json
          packages/adapter-hermes/coverage-python/
        retention-days: 14
        if-no-files-found: ignore
        # A re-run of a failed shard uploads under the same name. Without this
        # the run keeps both artifacts, and the coverage job can pick the one
        # from the failed attempt, which has no coverage file.
        overwrite: true
